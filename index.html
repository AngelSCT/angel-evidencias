<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Soto Trejo - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
            color: #1a1a1a;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 50px 20px 50px;
            background: linear-gradient(to right, #117533 0%, #1B396A 30%, #1B396A 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #1B396A, #117533);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            position: relative;
        }

        .logo {
            height: 80px;
            width: auto;
            object-fit: contain;
        }

        .logo.left {
            position: absolute;
            left: 20px;
        }

        .logo.right {
            position: absolute;
            right: 20px;
        }

        .header-content {
            flex: 1;
            text-align: center;
        }

        .header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 52px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.95);
            text-transform: uppercase;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 40px 60px;
            display: grid;
            grid-template-columns: 0.6fr 1.4fr;
            gap: 50px;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin: 40px auto 35px;
            padding: 14px 35px;
            text-align: center;
            background: linear-gradient(135deg, #1B396A 0%, #117533 100%);
            color: white;
            border-radius: 6px;
            box-shadow: 0 3px 12px rgba(27, 57, 106, 0.3);
            max-width: 320px;
            position: relative;
            overflow: hidden;
        }

        .section-title::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.5s ease;
        }

        .section-title:hover::before {
            left: 100%;
        }

        .gallery {
            display: grid;
            gap: 24px;
        }

        .photos-gallery {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .documents-gallery {
            grid-template-columns: 1fr;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: all 0.35s ease;
        }

        .photos-gallery .gallery-item {
            aspect-ratio: 4/3;
        }

        .documents-gallery .gallery-item.pdf-portrait {
            aspect-ratio: 8.5/11;
            height: auto;
            min-height: 420px;
        }

        .documents-gallery .gallery-item.pdf-landscape {
            aspect-ratio: 11/8.5;
            height: auto;
            min-height: 300px;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(27, 57, 106, 0.3);
        }

        .gallery-item img,
        .gallery-item canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #fafafa;
        }

        .photo-card,
        .pdf-card {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .photo-wrapper,
        .pdf-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .photo-wrapper img {
            object-fit: cover;
        }

        .pdf-wrapper canvas {
            object-fit: contain;
        }

        .photo-caption,
        .pdf-caption {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.98);
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            font-weight: 500;
            color: #4b5563;
            text-align: center;
            letter-spacing: 0.3px;
        }

        .pdf-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1B396A15, #11753315);
            color: #1B396A;
            font-size: 16px;
            font-weight: 500;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.97);
            z-index: 1000;
            animation: fadeIn 0.25s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 95%;
            max-height: 95%;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 92vh;
            display: block;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-content iframe {
            width: 85vw;
            height: 92vh;
            border: none;
            background: white;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: fixed;
            top: 25px;
            right: 35px;
            color: white;
            font-size: 36px;
            cursor: pointer;
            z-index: 1001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(27, 57, 106, 0.5);
            border-radius: 50%;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .modal-close:hover {
            background: rgba(27, 57, 106, 0.8);
            transform: rotate(90deg);
        }

        .modal-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 42px;
            cursor: pointer;
            z-index: 1001;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(27, 57, 106, 0.5);
            border-radius: 50%;
            transition: all 0.3s ease;
            user-select: none;
            backdrop-filter: blur(10px);
        }

        .modal-nav:hover {
            background: rgba(27, 57, 106, 0.8);
        }

        .modal-prev {
            left: 25px;
        }

        .modal-next {
            right: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .documents-gallery {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }

            .documents-gallery .gallery-item.pdf-portrait {
                min-height: 380px;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 30px 15px;
            }

            .logo {
                height: 50px;
            }

            .logo.left {
                left: 10px;
            }

            .logo.right {
                right: 10px;
            }

            .header h1 {
                font-size: 32px;
                letter-spacing: 1.5px;
            }

            .header p {
                font-size: 11px;
            }

            .section-title {
                font-size: 24px;
                padding: 12px 28px;
                max-width: 90%;
            }

            .photos-gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .documents-gallery {
                grid-template-columns: 1fr;
            }

            .documents-gallery .gallery-item.pdf-portrait {
                min-height: 350px;
            }

            .photo-caption,
            .pdf-caption {
                font-size: 11px;
                padding: 10px 12px;
            }

            .modal-content iframe {
                width: 95vw;
                height: 85vh;
            }
        }

        @media (max-width: 480px) {
            .logo {
                height: 40px;
            }

            .header h1 {
                font-size: 26px;
            }

            .header p {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <img src="assets/media/images/Logo-TecNM.png" alt="TecNM" class="logo left">
            <div class="header-content">
                <h1>Angel Soto Trejo</h1>
                <p>Computer Systems Engineering Student • Tecnológico de Celaya</p>
            </div>
            <img src="assets/media/images/logoTecCelaya.png" alt="Tec Celaya" class="logo right">
        </div>
    </div>

    <div class="container">
        <div class="section">
            <h2 class="section-title">Recognitions</h2>
            <div class="gallery documents-gallery" id="documentsGallery"></div>
        </div>

        <div class="section">
            <h2 class="section-title">Evidence</h2>
            <div class="gallery photos-gallery" id="photosGallery"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-close" onclick="closeModal()">&times;</div>
        <div class="modal-prev modal-nav" onclick="navigate(-1)">&#8249;</div>
        <div class="modal-next modal-nav" onclick="navigate(1)">&#8250;</div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // Mapeo de nombres a descripciones
        const photoDescriptions = {
            'p1': 'Premio Estatal Merito Laboral',
            'v1': '1st Volkswagen Desafio Team',
            'v2': 'Me',
            'v3': '1st Volkswagen Desafio Etapa 2',
            'v4': 'Semifinal Presentation',
            'v5': 'Volkswagen Desafio Team Credentials',
            'v6': 'Volkswagen Desafio Team',
            'v7': 'Volkswagen Intern Credential',
            'v8': '1st Volkswagen Desafio Etapa 1',
            'v9': 'Volkswagen Desafio Team',
            'n1': 'NVIDIA CONGRESS (CDMX)',
            'n2': 'NVIDIA CONGRESS (CDMX)',
            'n3': 'NVIDIA CONGRESS (CDMX)',
            'i1': 'InnovaTec Regional STAND',
            'i2': 'Proyecto InnovaTec Regional',
            'i3': 'InnovaTec Local',
            'r1': '1st Rally Latinoamericano',
            'r2': '1st Rally Latinoamericano',
            'r3': 'Reconocimiento Rally Latinoamericano'
        };

        const pdfDescriptions = {
            'angel-soto-trejo-innovatec-regional.pdf': 'InnovaTec Regional 2025',
            'empmanagement-2-0-reconocimiento-soto-trejo-angel.pdf': 'Empmanagement 2.0 PML 2024',
            'reconocimientohcm24-angelsoto.pdf': 'HCM NACIONAL 2024',
            'ganador-rally-latinoamericano-2025-sp.pdf': '1st Place Rally Latinoamericano 2025',
            'guanajuato-volks-constancia.pdf': 'Volkswagen Guanajuato Certificate',
            'reconocimiento-curso-ia.pdf': 'AI Course',
            'constancia-innobotica.pdf': 'Innobotica Certificate',
            'congreso-reconocimiento-soto-trejo-angel.pdf': 'Congress International 2024',
            'reconocimiento-innovatec-primer-lugar.pdf': '1st Place InnovaTec Local',
            'constancia-semana-lince-2025.pdf': 'Semana Lince Ponencia 2025',
            'reconocimiento-cisti2025.pdf': 'CISTI 2025 PONENCIA',
            'feria-proyectos-linces-2025.pdf': 'Feria de Proyectos Linces 2025'
        };

        const photos = [
            { type: 'image', thumb: 'assets/thumbs/images/p1.jpg', full: 'assets/media/images/p1.jpg', id: 'p1' },
            { type: 'image', thumb: 'assets/thumbs/images/v1.jpg', full: 'assets/media/images/v1.jpg', id: 'v1' },
            { type: 'image', thumb: 'assets/thumbs/images/v2.jpg', full: 'assets/media/images/v2.jpg', id: 'v2' },
            { type: 'image', thumb: 'assets/thumbs/images/v3.jpg', full: 'assets/media/images/v3.jpg', id: 'v3' },
            { type: 'image', thumb: 'assets/thumbs/images/v4.jpg', full: 'assets/media/images/v4.jpg', id: 'v4' },
            { type: 'image', thumb: 'assets/thumbs/images/v5.jpg', full: 'assets/media/images/v5.jpg', id: 'v5' },
            { type: 'image', thumb: 'assets/thumbs/images/v6.jpg', full: 'assets/media/images/v6.jpg', id: 'v6' },
            { type: 'image', thumb: 'assets/thumbs/images/v7.jpg', full: 'assets/media/images/v7.jpg', id: 'v7' },
            { type: 'image', thumb: 'assets/thumbs/images/v8.jpg', full: 'assets/media/images/v8.jpg', id: 'v8' },
            { type: 'image', thumb: 'assets/thumbs/images/v9.jpg', full: 'assets/media/images/v9.jpg', id: 'v9' },
            { type: 'image', thumb: 'assets/thumbs/images/n1.jpg', full: 'assets/media/images/n1.jpg', id: 'n1' },
            { type: 'image', thumb: 'assets/thumbs/images/n2.jpg', full: 'assets/media/images/n2.jpg', id: 'n2' },
            { type: 'image', thumb: 'assets/thumbs/images/n3.jpg', full: 'assets/media/images/n3.jpg', id: 'n3' },
            { type: 'image', thumb: 'assets/thumbs/images/i1.jpg', full: 'assets/media/images/i1.jpg', id: 'i1' },
            { type: 'image', thumb: 'assets/thumbs/images/i2.jpg', full: 'assets/media/images/i2.jpg', id: 'i2' },
            { type: 'image', thumb: 'assets/thumbs/images/i3.jpg', full: 'assets/media/images/i3.jpg', id: 'i3' },
            { type: 'image', thumb: 'assets/thumbs/images/r1.jpg', full: 'assets/media/images/r1.jpg', id: 'r1' },
            { type: 'image', thumb: 'assets/thumbs/images/r2.jpg', full: 'assets/media/images/r2.jpg', id: 'r2' },
            { type: 'image', thumb: 'assets/thumbs/images/r3.jpg', full: 'assets/media/images/r3.jpg', id: 'r3' }
        ];

        const documents = [
            { type: 'pdf', full: 'assets/media/pdfs/angel-soto-trejo-innovatec-regional.pdf', id: 'angel-soto-trejo-innovatec-regional.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/empmanagement-2-0-reconocimiento-soto-trejo-angel.pdf', id: 'empmanagement-2-0-reconocimiento-soto-trejo-angel.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/reconocimientohcm24-angelsoto.pdf', id: 'reconocimientohcm24-angelsoto.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/ganador-rally-latinoamericano-2025-sp.pdf', id: 'ganador-rally-latinoamericano-2025-sp.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/guanajuato-volks-constancia.pdf', id: 'guanajuato-volks-constancia.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/reconocimiento-curso-ia.pdf', id: 'reconocimiento-curso-ia.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/constancia-innobotica.pdf', id: 'constancia-innobotica.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/congreso-reconocimiento-soto-trejo-angel.pdf', id: 'congreso-reconocimiento-soto-trejo-angel.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/reconocimiento-innovatec-primer-lugar.pdf', id: 'reconocimiento-innovatec-primer-lugar.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/constancia-semana-lince-2025.pdf', id: 'constancia-semana-lince-2025.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/reconocimiento-cisti2025.pdf', id: 'reconocimiento-cisti2025.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/feria-proyectos-linces-2025.pdf', id: 'feria-proyectos-linces-2025.pdf' }
        ];

        const allItems = [...documents, ...photos];
        let currentIndex = 0;

        // Renderizar fotos con descripciones
        const photosGallery = document.getElementById('photosGallery');
        photos.forEach((item, index) => {
            const globalIndex = documents.length + index;
            const div = document.createElement('div');
            div.className = 'gallery-item';

            const photoCard = document.createElement('div');
            photoCard.className = 'photo-card';

            const photoWrapper = document.createElement('div');
            photoWrapper.className = 'photo-wrapper';

            const img = document.createElement('img');
            img.src = item.thumb;
            img.alt = '';
            img.loading = 'lazy';
            photoWrapper.appendChild(img);

            const caption = document.createElement('div');
            caption.className = 'photo-caption';
            caption.textContent = photoDescriptions[item.id] || '';

            photoCard.appendChild(photoWrapper);
            photoCard.appendChild(caption);
            div.appendChild(photoCard);

            div.onclick = () => openModal(globalIndex);
            photosGallery.appendChild(div);
        });

        // Renderizar documentos con detección de orientación
        const documentsGallery = document.getElementById('documentsGallery');
        documents.forEach((item, docIndex) => {
            const div = document.createElement('div');
            div.className = 'gallery-item';

            const pdfCard = document.createElement('div');
            pdfCard.className = 'pdf-card';

            const pdfWrapper = document.createElement('div');
            pdfWrapper.className = 'pdf-wrapper';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'pdf-loading';
            loadingDiv.textContent = 'Loading preview...';
            pdfWrapper.appendChild(loadingDiv);

            const caption = document.createElement('div');
            caption.className = 'pdf-caption';
            caption.textContent = pdfDescriptions[item.id] || '';

            pdfCard.appendChild(pdfWrapper);
            pdfCard.appendChild(caption);
            div.appendChild(pdfCard);

            // Generar vista previa del PDF con detección de orientación
            renderPDFThumbnail(item.full, pdfWrapper, loadingDiv, div, docIndex);

            div.onclick = () => openModal(docIndex);
            documentsGallery.appendChild(div);
        });

        async function renderPDFThumbnail(url, pdfWrapper, loadingDiv, galleryItem, docIndex) {
            try {
                const pdf = await pdfjsLib.getDocument(url).promise;
                const page = await pdf.getPage(1);

                const viewport = page.getViewport({ scale: 1 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                // Detectar orientación
                const isLandscape = viewport.width > viewport.height;

                if (isLandscape) {
                    galleryItem.classList.add('pdf-landscape');
                } else {
                    galleryItem.classList.add('pdf-portrait');
                }

                // Escala optimizada según orientación
                const containerWidth = 400;
                const scale = containerWidth / viewport.width;
                const scaledViewport = page.getViewport({ scale: scale * 1.5 });

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                await page.render({
                    canvasContext: context,
                    viewport: scaledViewport
                }).promise;

                loadingDiv.remove();
                pdfWrapper.appendChild(canvas);
            } catch (error) {
                loadingDiv.innerHTML = '<span style="font-size: 64px;">📄</span>';
                console.error('Error loading PDF:', error);
            }
        }

        function openModal(index) {
            currentIndex = index;
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            const item = allItems[index];

            content.innerHTML = '';

            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = item.full;
                img.alt = '';
                content.appendChild(img);
            } else if (item.type === 'pdf') {
                const iframe = document.createElement('iframe');
                iframe.src = item.full;
                content.appendChild(iframe);
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigate(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = allItems.length - 1;
            if (currentIndex >= allItems.length) currentIndex = 0;
            openModal(currentIndex);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
    </script>
</body>
</html>
