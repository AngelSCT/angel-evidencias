<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel Soto Trejo - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
            color: #1a1a1a;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 70px 20px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.95);
            text-transform: uppercase;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 40px 60px;
            display: grid;
            grid-template-columns: 1.4fr 0.6fr;
            gap: 50px;
        }

        .section {
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 2px;
            margin: 40px 0 35px;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .section-title::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .section-title:hover::before {
            left: 100%;
        }

        .gallery {
            display: grid;
            gap: 24px;
        }

        .photos-gallery {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .documents-gallery {
            grid-template-columns: 1fr;
        }

        .gallery-item {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 4px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: all 0.35s ease;
        }

        .photos-gallery .gallery-item {
            aspect-ratio: 4/3;
        }

        .documents-gallery .gallery-item {
            aspect-ratio: 8.5/11;
            height: auto;
            min-height: 420px;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.25);
        }

        .gallery-item img,
        .gallery-item canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .pdf-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea15, #764ba215);
            color: #667eea;
            font-size: 16px;
            font-weight: 500;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.97);
            z-index: 1000;
            animation: fadeIn 0.25s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            max-width: 95%;
            max-height: 95%;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 92vh;
            display: block;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-content iframe {
            width: 85vw;
            height: 92vh;
            border: none;
            background: white;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: fixed;
            top: 25px;
            right: 35px;
            color: white;
            font-size: 36px;
            cursor: pointer;
            z-index: 1001;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(102, 126, 234, 0.4);
            border-radius: 50%;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .modal-close:hover {
            background: rgba(102, 126, 234, 0.7);
            transform: rotate(90deg);
        }

        .modal-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 42px;
            cursor: pointer;
            z-index: 1001;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(102, 126, 234, 0.4);
            border-radius: 50%;
            transition: all 0.3s ease;
            user-select: none;
            backdrop-filter: blur(10px);
        }

        .modal-nav:hover {
            background: rgba(102, 126, 234, 0.7);
        }

        .modal-prev {
            left: 25px;
        }

        .modal-next {
            right: 25px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .documents-gallery {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }

            .documents-gallery .gallery-item {
                min-height: 380px;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 38px;
                letter-spacing: 2px;
            }

            .header p {
                font-size: 13px;
            }

            .section-title {
                font-size: 28px;
                padding: 15px;
            }

            .photos-gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .documents-gallery {
                grid-template-columns: 1fr;
            }

            .documents-gallery .gallery-item {
                min-height: 350px;
            }

            .modal-content iframe {
                width: 95vw;
                height: 85vh;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Angel Soto Trejo</h1>
        <p>Computer Systems Engineering Student • Tecnológico de Celaya</p>
    </div>

    <div class="container">
        <div class="section">
            <h2 class="section-title">Evidence</h2>
            <div class="gallery photos-gallery" id="photosGallery"></div>
        </div>

        <div class="section">
            <h2 class="section-title">Recognitions</h2>
            <div class="gallery documents-gallery" id="documentsGallery"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-close" onclick="closeModal()">&times;</div>
        <div class="modal-prev modal-nav" onclick="navigate(-1)">&#8249;</div>
        <div class="modal-next modal-nav" onclick="navigate(1)">&#8250;</div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const photos = [
            { type: 'image', thumb: 'assets/thumbs/images/p1.jpg', full: 'assets/media/images/p1.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v1.jpg', full: 'assets/media/images/v1.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v2.jpg', full: 'assets/media/images/v2.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v3.jpg', full: 'assets/media/images/v3.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v4.jpg', full: 'assets/media/images/v4.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v5.jpg', full: 'assets/media/images/v5.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v6.jpg', full: 'assets/media/images/v6.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v7.jpg', full: 'assets/media/images/v7.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v8.jpg', full: 'assets/media/images/v8.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/v9.jpg', full: 'assets/media/images/v9.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/n1.jpg', full: 'assets/media/images/n1.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/n2.jpg', full: 'assets/media/images/n2.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/n3.jpg', full: 'assets/media/images/n3.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/i1.jpg', full: 'assets/media/images/i1.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/i2.jpg', full: 'assets/media/images/i2.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/i3.jpg', full: 'assets/media/images/i3.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/r1.jpg', full: 'assets/media/images/r1.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/r2.jpg', full: 'assets/media/images/r2.jpg' },
            { type: 'image', thumb: 'assets/thumbs/images/r3.jpg', full: 'assets/media/images/r3.jpg' }
        ];

        const documents = [
            { type: 'pdf', full: 'assets/media/pdfs/angel-soto-trejo-innovatec-regional.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/congreso-reconocimiento-soto-trejo-angel.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/constancia-innobotica.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/constancia-semana-lince-2025.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/empmanagement-2-0-reconocimiento-soto-trejo-angel.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/feria-proyectos-linces-2025.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/ganador-rally-latinoamericano-2025-sp.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/guanajuato-volks-constancia.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/reconocimiento-cisti2025.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/reconocimiento-curso-ia.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/reconocimiento-innovatec-primer-lugar.pdf' },
            { type: 'pdf', full: 'assets/media/pdfs/reconocimientohcm24-angelsoto.pdf' }
        ];

        const allItems = [...photos, ...documents];
        let currentIndex = 0;

        // Renderizar fotos
        const photosGallery = document.getElementById('photosGallery');
        photos.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'gallery-item';

            const img = document.createElement('img');
            img.src = item.thumb;
            img.alt = '';
            img.loading = 'lazy';
            div.appendChild(img);

            div.onclick = () => openModal(index);
            photosGallery.appendChild(div);
        });

        // Renderizar documentos con vista previa PDF
        const documentsGallery = document.getElementById('documentsGallery');
        documents.forEach((item, docIndex) => {
            const globalIndex = photos.length + docIndex;
            const div = document.createElement('div');
            div.className = 'gallery-item pdf-item';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'pdf-loading';
            loadingDiv.textContent = 'Loading preview...';
            div.appendChild(loadingDiv);

            // Generar vista previa del PDF
            renderPDFThumbnail(item.full, div, loadingDiv);

            div.onclick = () => openModal(globalIndex);
            documentsGallery.appendChild(div);
        });

        async function renderPDFThumbnail(url, container, loadingDiv) {
            try {
                const pdf = await pdfjsLib.getDocument(url).promise;
                const page = await pdf.getPage(1);

                const viewport = page.getViewport({ scale: 1 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                // Escala optimizada para vista previa completa
                const containerWidth = 400;
                const scale = containerWidth / viewport.width;
                const scaledViewport = page.getViewport({ scale: scale * 1.5 });

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                await page.render({
                    canvasContext: context,
                    viewport: scaledViewport
                }).promise;

                loadingDiv.remove();
                container.appendChild(canvas);
            } catch (error) {
                loadingDiv.innerHTML = '<span style="font-size: 64px;">📄</span>';
                console.error('Error loading PDF:', error);
            }
        }

        function openModal(index) {
            currentIndex = index;
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            const item = allItems[index];

            content.innerHTML = '';

            if (item.type === 'image') {
                const img = document.createElement('img');
                img.src = item.full;
                img.alt = '';
                content.appendChild(img);
            } else if (item.type === 'pdf') {
                const iframe = document.createElement('iframe');
                iframe.src = item.full;
                content.appendChild(iframe);
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigate(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = allItems.length - 1;
            if (currentIndex >= allItems.length) currentIndex = 0;
            openModal(currentIndex);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
    </script>
</body>
</html>
